                  </div>
                  <button 
                    onClick={() => setChatOpen(false)} 
                    className="text-slate-400 hover:text-slate-600 ml-auto text-lg font-bold focus:outline-none"
                  >
                    &times;
                  </button>
                </div>

                <div className="space-y-2 mb-3 bg-slate-50 p-3 rounded-xl border border-slate-100 text-left">
                  <p className="text-[11px] text-slate-500 leading-relaxed font-light">
                    Escreva a sua dúvida ou solicitação e prima o botão para ser direcionado direto ao suporte do nosso WhatsApp.
                  </p>
                </div>

                <form onSubmit={sendFloatingMessage} className="flex gap-2">
                  <input 
                    type="text" 
                    value={chatMessage}
                    onChange={(e) => setChatMessage(e.target.value)}
                    placeholder="Escreva sua dúvida..." 
                    className="flex-1 bg-slate-50 text-slate-900 text-xs border border-slate-200 p-2.5 rounded-xl outline-none focus:ring-1 focus:ring-emerald-500 font-normal"
                    required
                  />
                  <button 
                    type="submit" 
                    className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl px-3 flex items-center justify-center cursor-pointer border border-emerald-500/20 shadow-sm"
                    title="Enviar"
                  >
                    <Icon name="Send" className="w-3.5 h-3.5 text-white" />
                  </button>
                </form>
              </div>
            )}

            <button 
              onClick={() => setChatOpen(!chatOpen)}
              className="w-14 h-14 rounded-full bg-emerald-600 hover:bg-emerald-500 flex items-center justify-center text-white shadow-lg cursor-pointer transition transform hover:scale-105 duration-150 relative border-2 border-white"
              title="Consulte Suporte Oficial"
            >
              {chatOpen ? <Icon name="X" className="w-6 h-6 text-white" /> : <Icon name="MessageSquare" className="w-6 h-6 text-white" />}
              
              {!chatOpen && (
                <span className="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-500 text-[10px] font-bold text-white flex items-center justify-center animate-bounce border border-white">
                  1
                </span>
              )}
            </button>
          </div>

          {/* REGISTRATION MODAL WITH DYNAMIC PRICE CALCULATION */}
          {modalInscricao && selectedCurso && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 md:p-8 relative shadow-2xl my-8 text-left slide-enter">
                <button 
                  onClick={() => setModalInscricao(false)} 
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 text-2xl font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center border border-slate-150 focus:outline-none"
                >
                  &times;
                </button>
                
                <h2 className="text-xl font-bold text-slate-900 font-display border-b border-slate-100 pb-3 mb-6">
                  Ficha de Inscrição Profissional
                </h2>
                
                <form className="space-y-4" onSubmit={(e) => { e.preventDefault(); submitInscricao(); }}>
                  
                  <div>
                    <label className="block text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 font-mono">Nome Completo</label>
                    <input 
                      type="text" 
                      value={formData.nome} 
                      onChange={(e) => setFormData({ ...formData, nome: e.target.value })}
                      placeholder="Ex: José José" 
                      className="w-full bg-slate-50 text-slate-900 border border-slate-200 p-3 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none transition text-sm font-normal"
                      required 
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 font-mono">WhatsApp (Angola)</label>
                    <input 
                      type="tel" 
                      value={formData.whatsapp} 
                      onChange={(e) => setFormData({ ...formData, whatsapp: e.target.value })}
                      placeholder="Ex: 953646352" 
                      className="w-full bg-slate-50 text-slate-900 border border-slate-200 p-3 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none transition text-sm font-normal"
                      required 
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 font-mono">E-mail (Opcional)</label>
                    <input 
                      type="email" 
                      value={formData.email} 
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      placeholder="Ex: soter@gmail.com" 
                      className="w-full bg-slate-50 text-slate-900 border border-slate-200 p-3 rounded-xl focus:ring-1 focus:ring-blue-500 outline-none transition text-sm font-normal"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 font-mono">Situação Profissional</label>
                    <select 
                      value={formData.situacao} 
                      onChange={(e) => setFormData({ ...formData, situacao: e.target.value })}
                      className="w-full bg-slate-50 text-slate-900 border border-slate-200 p-3 rounded-xl outline-none focus:ring-1 focus:ring-blue-500 text-sm font-normal"
                    >
                      <option value="Desempregado">Desempregado</option>
                      <option value="Empregado">Empregado</option>
                      <option value="Estudante">Estudante</option>
                      <option value="Empresário">Empresário</option>
                    </select>
                  </div>

                  <div className="p-3.5 bg-blue-50 rounded-xl border border-blue-100">
                    <p className="text-[9px] font-bold text-blue-600 uppercase tracking-widest mb-1">Software Escolhido</p>
                    <p className="font-extrabold text-[#0a192f] text-sm font-display">{selectedCurso.nome}</p>
                  </div>

                  <div>
                    <label className="block text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 font-mono">Modalidade do Curso</label>
                    <select 
                      value={formData.modalidade} 
                      onChange={(e) => setFormData({ ...formData, modalidade: e.target.value })}
                      className="w-full bg-slate-50 text-slate-900 border border-slate-200 p-3 rounded-xl outline-none focus:ring-1 focus:ring-blue-500 text-sm font-normal"
                    >
                      <option value="Utilizador">Operador Geral (Preço Base)</option>
                      <option value="Profissional">Técnico de Suporte com Instalação (+50%)</option>
                    </select>
                    <p className="text-[9px] text-slate-400 italic mt-1 leading-normal pl-0.5">
                      *<b>Técnico de Suporte</b> inclui aprendizagem de instalações locais, configurações de redes e suporte de impressões.
                    </p>
                  </div>

                  <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center shadow-inner mt-4">
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Valor do Investimento</p>
                    <p className="text-2xl font-black text-blue-650 font-display">
                      {formatarDinheiro(calcularPreco())}
                    </p>
                  </div>

                  <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl flex items-start gap-2.5">
                    <Icon name="Shield" className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />
                    <p className="text-[10px] text-amber-800 leading-normal font-light">
                      <b>Segurança JEOOTEC:</b> O nosso IBAN será enviado e verificado no canal do WhatsApp após confirmação da ficha por um consultor.
                    </p>
                  </div>

                  <button 
                    type="submit" 
                    className="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold hover:bg-blue-700 transition uppercase text-xs tracking-widest flex items-center justify-center gap-2"
                  >
                    Confirmar Inscrição no WhatsApp
                  </button>

                </form>
              </div>
            </div>
          )}

          {/* DETAILS INFO MODAL */}
          {modalDetails && selectedCurso && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 md:p-8 relative shadow-2xl text-left slide-enter">
                <button 
                  onClick={() => setModalDetails(false)} 
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-700 text-2xl font-bold bg-slate-100 w-8 h-8 rounded-full flex items-center justify-center border border-slate-150 focus:outline-none"
                >
                  &times;
                </button>
                
                <div className="text-center mb-5">
                  <div className="w-12 h-12 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 mx-auto mb-3">
                    <Icon name="BookOpen" className="w-6 h-6 text-blue-600" />
                  </div>
                  <h2 className="text-xl font-bold text-slate-900 font-display">{selectedCurso.nome}</h2>
                  <span className="text-[10px] text-slate-400 uppercase tracking-widest font-mono mt-0.5 block">Ficha Académica da Formação</span>
                </div>

                <div className="space-y-4 text-xs md:text-sm text-slate-600 font-light leading-relaxed">
                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-150 font-normal">
                    <h4 className="font-bold text-[10px] text-slate-400 uppercase font-mono mb-1">Módulos do Software</h4>
                    <p className="text-slate-500">{selectedCurso.modulosDisponiveis}</p>
                  </div>

                  <div className="p-3 bg-slate-50 rounded-xl border border-slate-150 font-normal">
                    <h4 className="font-bold text-[10px] text-slate-400 uppercase font-mono mb-1">Empresas que Demandam</h4>
                    <p className="text-slate-500">{selectedCurso.empresas}</p>
                  </div>

                  <div className="grid grid-cols-2 gap-3 text-center">
                    <div className="p-3 bg-slate-50 border border-slate-150 rounded-xl">
                      <h4 className="font-bold text-[9px] text-slate-400 uppercase font-mono mb-0.5">Vagas</h4>
                      <span className="font-bold text-slate-500">{selectedCurso.vagas === 0 ? 'Lotação Esgotada' : `${selectedCurso.vagas} Restantes`}</span>
                    </div>
                    <div className="p-3 bg-slate-50 border border-slate-150 rounded-xl">
                      <h4 className="font-bold text-[9px] text-slate-400 uppercase font-mono mb-0.5">Preço Base</h4>
                      <span className="font-bold text-blue-600">{selectedCurso.preco} Kz</span>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex gap-3 text-center">
                  <button 
                    onClick={() => setModalDetails(false)}
                    className="flex-grow bg-slate-105 text-slate-700 py-3 rounded-xl text-xs font-bold uppercase transition hover:bg-slate-200 cursor-pointer"
                  >
                    Fechar
                  </button>
                  <button 
                    onClick={() => {
                      setModalDetails(false);
                      if (selectedCurso.vagas === 0) {
                        alert(`As vagas atuais de ${selectedCurso.nome} estão esgotadas. Entre em contacto via WhatsApp.`);
                      } else {
                        openInscricao(selectedCurso);
                      }
                    }}
                    className={`flex-grow py-3 rounded-xl text-xs font-bold uppercase transition cursor-pointer ${
                      selectedCurso.vagas === 0 
                        ? 'bg-slate-200 text-slate-400 border border-slate-200 cursor-not-allowed' 
                        : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm'
                    }`}
                  >
                    Matrícula Fast
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount App component on HTML DOM root element
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
